[package]
name = "BypassNote"
version = "0.1.0"
description = "BypassNote Desktop App"
authors = ["mapersmusic"]
license = ""
repository = "https://github.com/mapersmusic/BypassNote"
default-run = "BypassNote"
edition = "2021"
rust-version = "1.70"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]