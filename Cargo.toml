[package]
name = "BypassNote"
version = "1.0.0"
description = "BypassNote Desktop App"
authors = ["mapersmusic"]
license = ""
repository = "https://github.com/mapersmusic/BypassNote"
default-run = "BypassNote"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["dialog-open", "dialog-save", "fs-read-file", "fs-write-file", "fs-read-dir", "fs-create-dir", "fs-copy-file", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]