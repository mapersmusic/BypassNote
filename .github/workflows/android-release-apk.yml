name: Build Android release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build protobuf sources
        run: npm run build-proto

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle', 'capacitor.config.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Clean Android platform
        run: rm -rf android
        shell: bash

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
        shell: bash

      - name: Decode and write release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
        shell: bash

      - name: Configure capacitor signing config
        run: |
          node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          config.android = config.android || {};
          config.android.buildOptions = {
            keystorePath: './release.keystore',
            keystorePassword: process.env.KEYSTORE_PASSWORD,
            keystoreAlias: process.env.KEYSTORE_ALIAS,
            keystoreAliasPassword: process.env.KEYSTORE_ALIAS_PASSWORD
          };
          fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
          "
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Generate Capacitor assets
        run: npx capacitor-assets generate

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
        shell: bash

      - name: Ensure apksigner is available
        run: |
          ANDROID_SDK=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          if [ -z "$ANDROID_SDK" ]; then
            for candidate in /usr/local/lib/android/sdk /usr/lib/android-sdk /opt/android-sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then
                ANDROID_SDK="$candidate"
                break
              fi
            done
          fi
          if [ -z "$ANDROID_SDK" ]; then
            echo "ANDROID_SDK_ROOT or ANDROID_HOME is not defined and no SDK found in standard locations" >&2
            exit 1
          fi
          echo "Using Android SDK at $ANDROID_SDK"
          if ! command -v apksigner >/dev/null 2>&1; then
            BUILD_TOOLS=$(ls "$ANDROID_SDK/build-tools" 2>/dev/null | sort -V | tail -n1)
            if [ -n "$BUILD_TOOLS" ] && [ -x "$ANDROID_SDK/build-tools/$BUILD_TOOLS/apksigner" ]; then
              echo "Adding Android build-tools $BUILD_TOOLS to PATH"
              echo "$ANDROID_SDK/build-tools/$BUILD_TOOLS" >> "$GITHUB_PATH"
            else
              echo "apksigner not found in Android SDK build-tools" >&2
              exit 1
            fi
          fi
        shell: bash

      - name: Build Android release with Capacitor
        run: npx cap build android --androidreleasetype APK --signing-type apksigner

      - name: Verify signed APK
        run: |
          find android/app/build/outputs/apk -type f -name '*-signed.apk' | sort > signed_apks.txt
          if [ ! -s signed_apks.txt ]; then
            echo "No signed APK found" >&2
            exit 1
          fi
          while IFS= read -r apk; do
            echo "Verifying $apk"
            apksigner verify "$apk"
          done < signed_apks.txt
        shell: bash

      - name: List signed APK outputs
        run: |
          echo "=== Signed APK files ==="
          find android/app/build/outputs/apk -type f -name '*-signed.apk' | sort || true
        shell: bash

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: bypassnote-release-apk
          path: android/app/build/outputs/apk/**/*-signed.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/**/*-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
