name: Build Android release APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'Production' || 'Development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build protobuf sources
        run: npm run build-proto

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle', 'capacitor.config.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Clean Android platform
        run: rm -rf android
        shell: bash

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
        shell: bash

      - name: Decode and write keystore
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "Using production keystore"
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
          else
            echo "Using development keystore"
            echo "${{ secrets.DEV_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
          fi
        shell: bash

      - name: Configure capacitor signing config
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const cfgPath = 'capacitor.config.json';
          const config = JSON.parse(fs.readFileSync(cfgPath, 'utf8'));
          config.android = config.android || {};
          const isTag = '${{ startsWith(github.ref, 'refs/tags/') }}' === 'true';
          const keystorePath = path.resolve('android', 'release.keystore');
          const keystorePassword = isTag ? process.env.RELEASE_KEYSTORE_PASSWORD : process.env.DEV_KEYSTORE_PASSWORD;
          const keystoreAlias = isTag ? process.env.RELEASE_KEYSTORE_ALIAS : process.env.DEV_KEYSTORE_ALIAS;
          const keystoreAliasPassword = isTag ? process.env.RELEASE_KEYSTORE_ALIAS_PASSWORD : process.env.DEV_KEYSTORE_ALIAS_PASSWORD;
          
          if (!fs.existsSync(keystorePath)) {
            console.error('Keystore file not found at', keystorePath);
            process.exit(1);
          }
          if (!keystorePassword || !keystoreAlias || !keystoreAliasPassword) {
            console.error('Missing keystore credentials. Please set the appropriate secrets for ' + (isTag ? 'release' : 'dev') + ' signing.');
            process.exit(1);
          }
          
          config.android.buildOptions = {
            keystorePath: keystorePath,
            keystorePassword: keystorePassword,
            keystoreAlias: keystoreAlias,
            keystoreAliasPassword: keystoreAliasPassword,
            keyAlias: keystoreAlias,
            keyPassword: keystoreAliasPassword
          };
          
          fs.writeFileSync(cfgPath, JSON.stringify(config, null, 2));
          console.log('Wrote android.buildOptions with keystorePath =', keystorePath);
          "
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEYSTORE_ALIAS_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_ALIAS_PASSWORD }}
          DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          DEV_KEYSTORE_ALIAS: ${{ secrets.DEV_KEYSTORE_ALIAS }}
          DEV_KEYSTORE_ALIAS_PASSWORD: ${{ secrets.DEV_KEYSTORE_ALIAS_PASSWORD }}

      - name: Show generated capacitor android buildOptions (masked)
        run: |
          node -e "
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          const b = (cfg.android && cfg.android.buildOptions) || {};
          console.log('keystorePath:', b.keystorePath);
          console.log('keystorePassword:', b.keystorePassword ? '<present>' : '<missing>');
          console.log('keystoreAlias:', b.keystoreAlias || '<missing>');
          console.log('keyAlias:', b.keyAlias || '<missing>');
          "
        shell: bash

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Generate Capacitor assets
        run: npx capacitor-assets generate

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
        shell: bash

      - name: Ensure apksigner is available
        run: |
          ANDROID_SDK=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          if [ -z "$ANDROID_SDK" ]; then
            for candidate in /usr/local/lib/android/sdk /usr/lib/android-sdk /opt/android-sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then
                ANDROID_SDK="$candidate"
                break
              fi
            done
          fi
          if [ -z "$ANDROID_SDK" ]; then
            echo "ANDROID_SDK_ROOT or ANDROID_HOME is not defined and no SDK found in standard locations" >&2
            exit 1
          fi
          echo "Using Android SDK at $ANDROID_SDK"
          if ! command -v apksigner >/dev/null 2>&1; then
            BUILD_TOOLS=$(ls "$ANDROID_SDK/build-tools" 2>/dev/null | sort -V | tail -n1)
            if [ -n "$BUILD_TOOLS" ] && [ -x "$ANDROID_SDK/build-tools/$BUILD_TOOLS/apksigner" ]; then
              echo "Adding Android build-tools $BUILD_TOOLS to PATH"
              echo "$ANDROID_SDK/build-tools/$BUILD_TOOLS" >> "$GITHUB_PATH"
            else
              echo "apksigner not found in Android SDK build-tools" >&2
              exit 1
            fi
          fi
        shell: bash

      - name: Build Android release with Capacitor
        run: npx cap build android --androidreleasetype APK --signing-type apksigner

      - name: Rename signed APK for consistency
        run: |
          SIGNED_APK=$(find android/app/build/outputs/apk -type f -name '*-signed.apk' | head -n 1)
          if [ -n "$SIGNED_APK" ]; then
            cp "$SIGNED_APK" android/app/build/outputs/apk/bypassnote-release-signed.apk
            echo "Renamed signed APK to bypassnote-release-signed.apk"
          else
            echo "No signed APK found to rename" >&2
            exit 1
          fi
        shell: bash

      - name: Verify signed APK
        run: |
          APK_PATH="android/app/build/outputs/apk/bypassnote-release-signed.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "No signed APK found at $APK_PATH" >&2
            exit 1
          fi
          echo "Verifying $APK_PATH"
          apksigner verify "$APK_PATH"
        shell: bash

      - name: List APK outputs
        run: |
          echo "=== APK files ==="
          find android/app/build/outputs/apk -type f -name "*.apk" | sort || true
        shell: bash

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: bypassnote-release-apk
          path: android/app/build/outputs/apk/bypassnote-release-signed.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/bypassnote-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
