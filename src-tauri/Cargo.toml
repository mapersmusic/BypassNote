[package]
name = "BypassNote"
version = "0.1.0"
description = "BypassNote Desktop App"
authors = ["mapersmusic"]
license = ""
repository = "https://github.com/mapersmusic/BypassNote"
default-run = "BypassNote"
edition = "2021"
rust-version = "1.90"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
